name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web — typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build

  model:
    name: Model — behaviour and the claim it rests on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ai/requirements.txt
      - name: Behavioural tests against the committed artefact
        run: cd ai && python -m pytest
      - name: Retraining still beats the sector table it replaced
        # The product's central claim. If a change to train.py stopped the model earning its place,
        # this fails rather than shipping a model that is no better than the lookup table.
        # train.py resolves models/ from its own location, so run it from the repository root and
        # read metrics.json from the same place — the check must not depend on the working directory.
        run: |
          python ai/train.py
          python - <<'PY'
          import json, sys
          m = json.load(open('ai/models/metrics.json'))
          print(f"model {m['model_share_mae']:.4f} vs sector table {m['sector_table_share_mae']:.4f} "
                f"({m['improvement_pct']:.1f}% better)")
          sys.exit(0 if m['improvement_pct'] > 50 else 1)
          PY

  api:
    name: API — contract against a live service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt -r backend/requirements-ocr.txt
      - name: Start the API
        run: |
          cd backend && python -m uvicorn server:app --host 127.0.0.1 --port 8001 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8001/api/health && break || sleep 0.5
          done
      - name: Contract tests
        run: cd backend && LEAKPOINT_API_URL=http://127.0.0.1:8001 python -m pytest
